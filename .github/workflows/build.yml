name: Build AnimeDL

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: windows-latest

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install aqtinstall
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall

      - name: Install Qt
        run: |
          python -m aqt install-qt windows desktop 6.10.3 win64_mingw --outputdir Qt