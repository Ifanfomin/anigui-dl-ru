name: Build AnimeDL

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install aqt
        run: |
          python -m pip install --upgrade pip
          python -m pip install aqtinstall

      - name: Install Qt 6.10.3
        run: |
          python -m aqt install-qt windows desktop 6.10.3 win64_mingw --outputdir Qt

      - name: Add Qt to PATH
        shell: pwsh
        run: |
          "$PWD/Qt/Tools/mingw1310_64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$PWD/Qt/6.10.3/mingw_64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      
      - name: List available tools
        run: |
          python -m aqt list-tool windows desktop
      
      - name: Clean build
        run: |
          Remove-Item build -Recurse -Force -ErrorAction Ignore
          
      - name: Install MinGW 13.1
        run: |
          python -m aqt install-tool windows desktop tools_mingw1310 --outputdir Qt

      - name: Verify MinGW
        shell: pwsh
        run: |
          Get-ChildItem Qt/Tools
          Get-ChildItem Qt/Tools/mingw1310_64/bin | Select-Object Name

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "MinGW Makefiles" `
            -DCMAKE_PREFIX_PATH="$PWD/Qt/6.10.3/mingw_64" `
            -DCMAKE_C_COMPILER="$PWD/Qt/Tools/mingw1310_64/bin/gcc.exe" `
            -DCMAKE_CXX_COMPILER="$PWD/Qt/Tools/mingw1310_64/bin/g++.exe"

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Deploy Qt
        shell: pwsh
        run: |
          & "$PWD/Qt/6.10.3/mingw_64/bin/windeployqt.exe" `
            --release `
            --compiler-runtime `
            --no-translations `
            --no-system-d3d-compiler `
            --no-opengl-sw `
            build/animedl.exe

      - name: Cleanup distribution
        shell: pwsh
        run: |
          # CMake artifacts
          Remove-Item build/animedl_autogen -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item build/CMakeFiles -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item build/CMakeCache.txt -Force -ErrorAction SilentlyContinue
          Remove-Item build/cmake_install.cmake -Force -ErrorAction SilentlyContinue
          Remove-Item build/Makefile -Force -ErrorAction SilentlyContinue

          # Unused Qt components
          Remove-Item build/generic -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item build/networkinformation -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item build/tls -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item build/iconengines -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item build/imageformats -Recurse -Force -ErrorAction SilentlyContinue

          Remove-Item build/Qt6Network.dll -Force -ErrorAction SilentlyContinue
          Remove-Item build/Qt6Svg.dll -Force -ErrorAction SilentlyContinue

      - name: Install 7-Zip
        shell: pwsh
        run: |
          choco install 7zip -y --no-progress

      - name: Create SFX configuration
        shell: pwsh
        run: |
          @"
          ;!@Install@!UTF-8!
          RunProgram="animedl.exe"
          ;!@InstallEnd@!
          "@ | Set-Content -Path sfx-config.txt -Encoding UTF8

      - name: Create archive
        shell: pwsh
        run: |
          & "C:\Program Files\7-Zip\7z.exe" a `
            -t7z `
            -mx=9 `
            animedl.7z `
            ".\build\*"

      - name: Create single EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $sfx = "C:\Program Files\7-Zip\7z.sfx"

          cmd /c "copy /b `"$sfx`" + sfx-config.txt + animedl.7z dist\animedl.exe"

      - name: Verify final EXE
        shell: pwsh
        run: |
          Write-Host "Final AnimeDL:"
          Get-Item dist/animedl.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: animedl
          path: dist/animedl.exe